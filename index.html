<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Happy Birthday, Babyyy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6ECE2;
    --paper-2:#EFE0D2;
    --wine:#5C1F31;
    --ink:#3A2418;
    --rose:#C25B65;
    --rose-light:#E8B9BD;
    --gold:#B98A3E;
    --line: rgba(58,36,24,0.15);
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; width:100%; max-width:100%;
    overflow-x:hidden;
  }
  body{
    min-height:100svh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
  }
  .display{ font-family:'Fraunces', serif; }
  button{ font-family:inherit; }
  img{ max-width:100%; display:block; }

  .stage{ min-height:100svh; width:100%; position:relative; }

  .view{
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100svh; width:100%;
    padding:7vh 1.4rem 6vh;
  }
  .view.active{ display:flex; animation:viewIn 0.5s ease forwards; }
  @keyframes viewIn{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .container{ width:100%; max-width:400px; display:flex; flex-direction:column; align-items:center; }

  /* ---------- HERO ---------- */
  .hero-kicker{
    font-size:0.95rem; font-style:italic;
    color:var(--rose); font-family:'Fraunces', serif; margin:0 0 0.3rem;
    animation:fadeIn 0.6s ease both;
  }
  .hero-name{
    font-size:clamp(2.6rem, 15vw, 4.2rem); line-height:1; margin:0;
    font-weight:500; font-style:italic; color:var(--wine); text-align:center;
    animation:nameBounce 0.7s cubic-bezier(.34,1.56,.64,1) 0.1s both;
  }
  @keyframes nameBounce{ from{ opacity:0; transform:scale(0.8) translateY(8px); } }
  @keyframes fadeIn{ from{ opacity:0; } }
  .hero-sub{
    max-width:30ch; margin:1.1rem auto 0; text-align:center;
    font-size:0.98rem; line-height:1.6; opacity:0.82;
  }
  .btn{
    background:var(--wine); color:var(--paper); border:none;
    padding:0.9rem 2.1rem; border-radius:100px;
    font-family:'Fraunces', serif; font-style:italic; font-size:1rem;
    cursor:pointer; box-shadow:0 10px 20px rgba(92,31,49,0.25);
    transition:transform 0.18s cubic-bezier(.34,1.56,.64,1);
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:scale(0.94); }
  .start-btn{ margin-top:2.2rem; }

  .heart-float{
    position:fixed; color:var(--rose); opacity:0; font-size:1rem;
    animation:floatUp 8s ease-in infinite; pointer-events:none; z-index:1;
  }
  @keyframes floatUp{
    0%{opacity:0; transform:translateY(0) scale(0.7);}
    12%{opacity:0.4;} 85%{opacity:0.2;}
    100%{opacity:0; transform:translateY(-60vh) scale(1.05);}
  }

  /* ---------- Q&A VIEW ---------- */
  .progress{ display:flex; gap:7px; margin-bottom:1.6rem; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--line); transition:all 0.3s ease; }
  .dot.done{ background:var(--rose); }
  .dot.current{ background:var(--wine); transform:scale(1.3); }

  .qa-card{
    width:100%; background:var(--paper);
    border:1px solid var(--line); border-radius:18px;
    box-shadow:0 14px 28px rgba(58,36,24,0.12);
    padding:1.7rem 1.4rem;
    animation:cardIn 0.4s cubic-bezier(.34,1.4,.5,1) both;
  }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(10px) scale(0.98); } }

  .q-text{
    font-family:'Fraunces', serif; font-style:italic; color:var(--wine);
    font-size:1.35rem; line-height:1.35; text-align:center; margin:0 0 1.5rem;
  }
  .options{ display:flex; flex-direction:column; gap:0.7rem; }
  .option-btn{
    width:100%; background:var(--paper-2); border:1px solid var(--line);
    border-radius:12px; padding:0.85rem 1.1rem; text-align:left;
    font-size:0.98rem; color:var(--ink); cursor:pointer;
    transition:transform 0.15s cubic-bezier(.34,1.56,.64,1), background 0.2s ease, border-color 0.2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .option-btn:active{ transform:scale(0.97); }
  .option-btn.chosen{ background:var(--rose-light); border-color:var(--rose); }

  .answer-photo{
    width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden;
    margin-bottom:1.2rem; box-shadow:0 10px 22px rgba(58,36,24,0.15);
    background:var(--paper-2);
  }
  .answer-photo img{ width:100%; height:100%; object-fit:cover; object-position:50% 22%; }
  .answer-text{ font-size:1rem; line-height:1.7; }
  .answer-text p{ margin:0 0 0.9rem; }
  .continue-btn{ margin-top:0.6rem; align-self:center; }

  .sparkle{
    position:absolute; pointer-events:none; font-size:0.95rem; color:var(--gold);
    animation:sparklePop 0.9s ease-out forwards; z-index:20;
  }
  @keyframes sparklePop{
    0%{ opacity:0; transform:translate(0,0) scale(0.3) rotate(0deg); }
    30%{ opacity:1; }
    100%{ opacity:0; transform:var(--sp-end) scale(1) rotate(160deg); }
  }

  /* ---------- BRIDGE ---------- */
  .bridge-text{
    font-family:'Fraunces', serif; font-style:italic; color:var(--wine);
    font-size:clamp(1.3rem, 6vw, 1.6rem); text-align:center; max-width:24ch;
    line-height:1.5; margin:0 0 2rem;
  }

  /* ---------- CAKE VIEW ---------- */
  .closing-pre{
    font-family:'Fraunces', serif; font-style:italic; color:var(--rose);
    font-size:1.05rem; margin:0 0 1.6rem; text-align:center;
  }
  .cake-plate{
    width:min(60vw,200px); height:60px; border-radius:50%;
    background:radial-gradient(ellipse at center, var(--paper-2), transparent 70%);
    margin-top:-8px;
  }
  .cake-wrap{ cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; transition:transform 0.2s cubic-bezier(.34,1.56,.64,1); }
  .cake-wrap:active{ transform:scale(0.95); }
  .cake-wrap svg{ width:min(46vw,168px); height:auto; display:block; }
  .flame{ transform-origin:50% 100%; transform-box:fill-box; animation:flicker 1.6s ease-in-out infinite; }
  @keyframes flicker{
    0%,100%{ transform:scaleY(1) rotate(0deg); } 50%{ transform:scaleY(1.12) rotate(-2deg); }
  }
  .flame.resist{ animation:resist 0.45s ease; }
  @keyframes resist{
    0%{ transform:scaleY(1) rotate(0deg); }
    30%{ transform:scaleY(0.25) rotate(-14deg) translateX(-3px); }
    55%{ transform:scaleY(1.35) rotate(10deg) translateX(2px); }
    100%{ transform:scaleY(1) rotate(0deg); }
  }
  .cake-wrap.shake{ animation:cakeShake 0.4s ease; }
  @keyframes cakeShake{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    25%{ transform:translateX(-4px) rotate(-1.5deg); }
    75%{ transform:translateX(4px) rotate(1.5deg); }
  }
  .cake-wrap.blown .flame{ animation:none; opacity:0; transition:opacity 0.4s ease; }
  .cake-hint{ margin-top:0.6rem; font-size:0.8rem; opacity:0.55; text-align:center; min-height:1.2em; transition:opacity 0.15s ease; }
  .final-message{
    max-width:26ch; margin-top:1.8rem; font-family:'Fraunces', serif; font-style:italic;
    font-size:clamp(1.2rem, 6vw, 1.5rem); color:var(--wine); line-height:1.5;
    text-align:center; opacity:0; transform:translateY(8px) scale(0.94);
    transition:opacity 0.6s cubic-bezier(.34,1.56,.64,1), transform 0.6s cubic-bezier(.34,1.56,.64,1);
  }
  .final-message.show{ opacity:1; transform:translateY(0) scale(1); }
  .confetti-heart{
    position:fixed; top:-5vh; font-size:1rem; color:var(--rose);
    pointer-events:none; animation:fall linear forwards; z-index:40;
  }
  @keyframes fall{ to{ transform:translateY(115vh) rotate(200deg); opacity:0.15; } }
  .footer-note{ margin-top:2.6rem; font-size:0.75rem; opacity:0.4; text-align:center; }
</style>
</head>
<body>

<audio id="bgSong" loop preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="stage" id="stage">

  <!-- HERO -->
  <div class="view active" id="view-hero">
    <div class="container">
      <p class="hero-kicker">happy birthday</p>
      <h1 class="hero-name display">Babyyy</h1>
      <p class="hero-sub">answer a few things for me. each answer gets you a little message.</p>
      <button class="btn start-btn" id="startBtn">let's go</button>
    </div>
  </div>

  <!-- Q&A -->
  <div class="view" id="view-qa">
    <div class="container">
      <div class="progress" id="progress"></div>

      <!-- asking state -->
      <div class="qa-card" id="askCard">
        <p class="q-text display" id="qText"></p>
        <div class="options" id="qOptions"></div>
      </div>

      <!-- answered state -->
      <div class="qa-card" id="answerCard" style="display:none;">
        <div class="answer-photo"><img id="answerPhoto" src="" alt=""></div>
        <div class="answer-text" id="answerText"></div>
        <button class="btn continue-btn" id="continueBtn">continue</button>
      </div>
    </div>
  </div>

  <!-- BRIDGE -->
  <div class="view" id="view-bridge">
    <div class="container">
      <p class="bridge-text display">that's everything I wanted to say. one more thing before you go.</p>
      <button class="btn" id="toCakeBtn">okay</button>
    </div>
  </div>

  <!-- CAKE -->
  <div class="view" id="view-cake">
    <div class="container">
      <p class="closing-pre display">make a wish</p>
      <div class="cake-wrap" id="cakeWrap">
        <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
          <g class="flame">
            <path d="M100 42c6 8 6 14 0 20-6-6-6-12 0-20z" fill="#B98A3E"/>
            <path d="M100 50c3 4 3 7 0 10-3-3-3-6 0-10z" fill="#E8B9BD"/>
          </g>
          <rect x="97" y="62" width="6" height="24" rx="1.5" fill="#C25B65"/>
          <circle cx="70" cy="88" r="7" fill="#E8B9BD"/>
          <circle cx="100" cy="85" r="8" fill="#E8B9BD"/>
          <circle cx="130" cy="88" r="7" fill="#E8B9BD"/>
          <rect x="55" y="88" width="90" height="34" rx="6" fill="#EFE0D2" stroke="#5C1F31" stroke-width="1.3"/>
          <line x1="55" y1="105" x2="145" y2="105" stroke="#C25B65" stroke-width="1.3" stroke-dasharray="3 4"/>
          <rect x="35" y="122" width="130" height="38" rx="6" fill="#F6ECE2" stroke="#5C1F31" stroke-width="1.3"/>
          <line x1="35" y1="141" x2="165" y2="141" stroke="#C25B65" stroke-width="1.3" stroke-dasharray="3 4"/>
          <ellipse cx="100" cy="166" rx="72" ry="9" fill="#EFE0D2"/>
        </svg>
      </div>
      <p class="cake-hint" id="cakeHint">tap the candle</p>
      <p class="final-message display" id="finalMessage">I choose you.<br>Today, and every day after.</p>
      <p class="footer-note">made by me, for you. happy birthday, Babyyy.</p>
    </div>
  </div>

</div>

      options: [
        {
          label: "as your girlfriend",
          text: [
            "That, and so much more.",
            "You're the most beautiful woman I've ever seen. Not just how you look, though that's true too. It's how you think, how you care about people, and how you are with me even on the hard days."
          ]
        },
        {
          label: "as something more",
          text: [
            "Yeah, exactly that.",
            "You're the most beautiful woman I've ever seen. Not just how you look, though that's true too. It's how you think, how you care about people, and how you are with me even on the hard days."
          ]
        }
      ]
    }
  ];

  const viewHero = document.getElementById('view-hero');
  const viewQA = document.getElementById('view-qa');
  const viewBridge = document.getElementById('view-bridge');
  const viewCake = document.getElementById('view-cake');
  const askCard = document.getElementById('askCard');
  const answerCard = document.getElementById('answerCard');
  const qText = document.getElementById('qText');
  const qOptions = document.getElementById('qOptions');
  const answerPhoto = document.getElementById('answerPhoto');
  const answerText = document.getElementById('answerText');
  const progress = document.getElementById('progress');

  let index = 0;

  function showView(view){
    [viewHero, viewQA, viewBridge, viewCake].forEach(v => v.classList.remove('active'));
    void view.offsetWidth;
    view.classList.add('active');
    window.scrollTo({top:0});
  }

  function buildProgress(){
    progress.innerHTML = '';
    questions.forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'dot' + (i < index ? ' done' : i === index ? ' current' : '');
      progress.appendChild(d);
    });
  }

  function loadQuestion(){
    const item = questions[index];
    qText.textContent = item.q;
    qOptions.innerHTML = '';
    item.options.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'option-btn';
      b.textContent = opt.label;
      b.addEventListener('click', () => selectOption(opt, b));
      qOptions.appendChild(b);
    });
    askCard.style.display = 'block';
    answerCard.style.display = 'none';
    buildProgress();
  }

  function selectOption(opt, btnEl){
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('chosen'));
    btnEl.classList.add('chosen');
    burstSparkles(btnEl);
    setTimeout(() => {
      const item = questions[index];
      answerPhoto.src = item.photo;
      answerText.innerHTML = opt.text.map(p => `<p>${p}</p>`).join('');
      askCard.style.display = 'none';
      answerCard.style.display = 'block';
    }, 260);
  }

  document.getElementById('continueBtn').addEventListener('click', () => {
    if(index < questions.length - 1){
      index++;
      loadQuestion();
    } else {
      showView(viewBridge);
    }
  });

  const bgSong = document.getElementById('bgSong');
  bgSong.volume = 0.55;

  function tryPlaySong(){
    const p = bgSong.play();
    if(p && p.catch){
      p.catch(() => {
        // Autoplay was blocked by the browser — start on first tap/click anywhere.
        const resume = () => {
          bgSong.play().catch(() => {});
          document.removeEventListener('click', resume);
          document.removeEventListener('touchstart', resume);
        };
        document.addEventListener('click', resume, { once:true });
        document.addEventListener('touchstart', resume, { once:true });
      });
    }
  }

  // Attempt to start music the moment the page opens.
  tryPlaySong();

  document.getElementById('startBtn').addEventListener('click', () => {
    index = 0;
    loadQuestion();
    showView(viewQA);
    tryPlaySong();
  });

  document.getElementById('toCakeBtn').addEventListener('click', () => showView(viewCake));

  function burstSparkles(anchorEl){
    const rect = anchorEl.getBoundingClientRect();
    const symbols = ['✦','✧','♥'];
    for(let i=0;i<8;i++){
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 30 + Math.random()*36;
      s.style.setProperty('--sp-end', `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`);
      s.style.left = (rect.left + rect.width/2 + window.scrollX) + 'px';
      s.style.top = (rect.top + rect.height/2 + window.scrollY) + 'px';
      s.style.position = 'fixed';
      s.style.animationDelay = (Math.random()*0.1) + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
  }

  for(let i=0;i<6;i++){
    const h = document.createElement('span');
    h.className = 'heart-float';
    h.textContent = i % 2 === 0 ? '♥' : '♡';
    h.style.left = (Math.random()*88 + 6) + '%';
    h.style.animationDelay = (Math.random()*8) + 's';
    h.style.fontSize = (0.8 + Math.random()*0.7) + 'rem';
    document.body.appendChild(h);
  }

  const cakeWrap = document.getElementById('cakeWrap');
  const cakeHint = document.getElementById('cakeHint');
  const finalMessage = document.getElementById('finalMessage');
  const flameEl = cakeWrap.querySelector('.flame');
  let blown = false;
  let tries = 0;
  const tapsNeeded = 4;
  const teaseLines = [
    "tap the candle to make a wish",
    "nope, still lit. try again",
    "so stubborn, huh? one more",
    "almost... really, one more"
  ];
  cakeHint.textContent = teaseLines[0];

  cakeWrap.addEventListener('click', () => {
    if(blown) return;
    tries++;
    if(tries < tapsNeeded){
      flameEl.classList.remove('resist');
      void flameEl.offsetWidth;
      flameEl.classList.add('resist');
      cakeWrap.classList.remove('shake');
      void cakeWrap.offsetWidth;
      cakeWrap.classList.add('shake');
      cakeHint.style.opacity = '0';
      setTimeout(() => {
        cakeHint.textContent = teaseLines[Math.min(tries, teaseLines.length - 1)];
        cakeHint.style.opacity = '0.55';
      }, 150);
      return;
    }
    blown = true;
    cakeWrap.classList.add('blown');
    cakeHint.style.opacity = '0';
    burstSparkles(cakeWrap);
    setTimeout(() => {
      finalMessage.classList.add('show');
      dropConfetti();
    }, 400);
  });

  function dropConfetti(){
    const symbols = ['♥','♡','✦'];
    for(let i=0;i<24;i++){
      setTimeout(() => {
        const c = document.createElement('span');
        c.className = 'confetti-heart';
        c.textContent = symbols[Math.floor(Math.random()*symbols.length)];
        c.style.left = (Math.random()*100) + 'vw';
        c.style.fontSize = (0.8 + Math.random()*1.1) + 'rem';
        c.style.animationDuration = (3 + Math.random()*2.5) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6000);
      }, i * 70);
    }
  }
</script>
